name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Generate test fixtures
        run: python scripts/generate_test_audio.py --output tests/fixtures

      - name: Run linting
        run: ruff check bbwatch/ tests/

      - name: Run type checking
        run: mypy bbwatch/ --ignore-missing-imports

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=bbwatch --cov-report=xml

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dev
          push: false
          tags: bbwatch:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ARM64 image (for Raspberry Pi)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.rpi
          push: false
          platforms: linux/arm64
          tags: bbwatch:rpi
          cache-from: type=gha
          cache-to: type=gha,mode=max
