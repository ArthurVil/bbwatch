# Audio capture configuration
audio:
  segment_duration_s: .33
  overlap_s: 0.1
  sample_rate: 48000
  channels: 1
  device_index: "plughw:2,0"  # WEBCAM ESSENTIELB W1 mic (use plughw: for format conversion)

# Cry detection parameters
detection:
  bandpass_low_hz: 250.0
  bandpass_high_hz: 2000.0
  rms_threshold: 0.02
  min_active_ratio: 0.03  # percentage of the time the signal is above the threshold
  silence_threshold: 0.001

# Disk storage limits
storage:
  wav_dir: wav_segments
  max_size_mb: 1024.0
  delete_empty_segments: true
  cleanup_interval_s: 60.0

# Alert configuration
alerts:
  status_file: status.json
  overlay_dir: overlays
  alert_cooldown_s: 1.0
  health_timeout_s: 3.0

# Motion detection parameters
motion:
  threshold: 10                      # Pixel difference threshold (1-255): lower = more sensitive
  blur_size: 5                       # Gaussian blur kernel size (must be odd): higher = less noise
  dilation_iterations: 1             # Morphology iterations to fill gaps (0-10): higher = larger motion blobs
  motion_threshold_percent: 10.0     # % of changed pixels to trigger (0.1-50): lower = more sensitive
  history_len: 10                    # Motion history buffer size (10-1000)
  fps: 5                             # Motion detection frame rate (1-30): higher = more responsive

# Runtime options
log_level: INFO
fake_hardware: false
data_dir: ~/bbwatch_data

# Host hardware configuration (physical paths)
host:
  video_device: "/dev/video0"        # Physical video device to pass to Docker
  pulse_source: ""                   # (Optional) Specific PulseAudio source name

# === Raspberry Pi 5 + Pi Camera Module 3 ===
# On RPi5, bbwatch automatically detects Pi Camera modules via libcamera.
# No manual config is required — motion detection will use go2rtc's RTSP restream.
# To verify detection, run: make devices
#
# For Docker on RPi5:
#   - Dockerfile.rpi includes libcamera and picamera2 packages
#   - go2rtc.yaml uses native rpicam source: rpicam:0
#   - docker-compose.yml mounts /dev/media0 for libcamera access

# === Viewer Connectivity Watchdog ===
# Alerts when all viewers disconnect from the go2rtc stream.
# Credentials must match GO2RTC_USERNAME / GO2RTC_PASSWORD in docker/.env.
#
# watchdog:
#   enabled: false
#   go2rtc_api_url: "http://go2rtc:1984"
#   go2rtc_username: ""        # or set via BBWATCH_WATCHDOG__GO2RTC_USERNAME
#   go2rtc_password: ""        # or set via BBWATCH_WATCHDOG__GO2RTC_PASSWORD
#   stream_name: babycam
#   poll_interval_s: 10.0
#   notifier: none             # ntfy | webhook | none
#   ntfy_url: ""               # e.g. https://ntfy.sh/my-topic
#   webhook_url: ""            # e.g. http://homeassistant.local:8123/api/webhook/xyz
#   alert_message: "bbwatch: viewer disconnected from stream"
