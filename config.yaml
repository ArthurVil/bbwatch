# Audio capture configuration
audio:
  segment_duration_s: 1.0
  overlap_s: 0.5
  sample_rate: 48000
  channels: 1
  device_index: "plughw:1,0"  # WEBCAM ESSENTIELB W1 mic (use plughw: for format conversion) 

# Cry detection parameters
detection:
  bandpass_low_hz: 250.0
  bandpass_high_hz: 2000.0
  rms_threshold: 0.02
  min_active_ratio: 0.03  # percentage of the time the signal is above the threshold
  silence_threshold: 0.001

# Disk storage limits
storage:
  wav_dir: wav_segments
  max_size_mb: 1024.0
  delete_empty_segments: true
  cleanup_interval_s: 60.0

# Alert configuration
alerts:
  status_file: status.json
  overlay_dir: overlays
  alert_cooldown_s: 5.0
  health_timeout_s: 10.0

# Runtime options
log_level: INFO
fake_hardware: false
data_dir: ~/bbwatch_data
