# docker/docker-compose.yml
version: '3.8'

services:
  # Run tests
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    command: python3 -m pytest tests/ -v --tb=short

  # Audio demo with microphone passthrough
  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      - BBWATCH_LOG_LEVEL=DEBUG
    command: python3 scripts/demo.py --loop
    profiles:
      - demo

  # Video demo with webcam passthrough (requires X11)
  demo-video:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    devices:
      - /dev/video0:/dev/video0
    group_add:
      - video
    environment:
      - DISPLAY=${DISPLAY}
    command: python3 scripts/demo_video.py
    profiles:
      - demo

  # Full bbwatch application
  bbwatch:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
      - bbwatch_data:/app/data
    environment:
      - BBWATCH_LOG_LEVEL=DEBUG
      - BBWATCH_FAKE_HARDWARE=false
      - BBWATCH_DATA_DIR=/app/data
      - BBWATCH_AUDIO__DEVICE_INDEX=rtsp://go2rtc:8554/babycam
    depends_on:
      - go2rtc
    command: /app/docker/entrypoint.sh
  # Streaming server (Go2RTC)
  go2rtc:
    image: alexxit/go2rtc:latest
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
      - ..:/app:ro  # Read overlays generated by bbwatch
      - bbwatch_data:/app/data:ro
      - /run/user/1000/pulse/native:/run/user/1000/pulse/native
      - /home/avilhelm/.config/pulse/cookie:/root/.config/pulse/cookie
    environment:
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - PULSE_COOKIE=/root/.config/pulse/cookie
    devices:
      - /dev/video0:/dev/video0
      - /dev/snd:/dev/snd
    ports:
      - "1984:1984"
      - "8554:8554"
    group_add:
      - video
      - audio

  # Interactive shell
  shell:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    stdin_open: true
    tty: true
    command: /bin/bash
    profiles:
      - dev

  # Fake audio generator for integration testing
  audio_generator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - test_data:/app/wav_segments
    command: python3 scripts/generate_test_audio.py --output /app/wav_segments --loop
    profiles:
      - integration

volumes:
  bbwatch_data:
