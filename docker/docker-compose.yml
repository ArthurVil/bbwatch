# docker/docker-compose.yml

services:
  # Run tests
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    command: python3 -m pytest tests/ -v --tb=short

  # Audio demo with microphone passthrough
  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      - BBWATCH_LOG_LEVEL=DEBUG
    command: python3 scripts/demo.py --loop
    profiles:
      - demo

  # Video demo with webcam passthrough (requires X11)
  demo-video:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    devices:
      - /dev/video0:/dev/video0
    group_add:
      - video
    environment:
      - DISPLAY=${DISPLAY}
    command: python3 scripts/demo_video.py
    profiles:
      - demo

  # Full bbwatch application.
  # go2rtc runs natively on the host (deploy/go2rtc-host.yaml +
  # deploy/go2rtc.service): the CSI camera needs the host libcamera stack,
  # which no stock go2rtc image provides. The go2rtc host comes from
  # RPI_HOST in the repo-root .env — with rootless Docker neither
  # localhost nor host-gateway reaches the real host, only its LAN IP.
  # The overlay FIFO is shared via the ../data bind mount go2rtc reads.
  bbwatch:
    build:
      context: ..
      # Dockerfile.dev (default) for x86 dev; set BBWATCH_DOCKERFILE=Dockerfile.rpi
      # in docker/.env on the Pi for the slim runtime-only image.
      dockerfile: docker/${BBWATCH_DOCKERFILE:-Dockerfile.dev}
    # This is a 24/7 monitor: a crash or a host reboot must not leave it
    # silently down until someone notices (see .claude/rules/reliability.md).
    # unless-stopped (not always) still honors a deliberate `docker compose
    # stop` — it won't fight you during maintenance, but recovers from
    # anything else, including dockerd itself restarting after a reboot.
    restart: unless-stopped
    network_mode: host
    # Run as container root: under rootless Docker this maps to the host user,
    # which owns the bind mounts (the rpi image's non-root user cannot write them).
    user: "0:0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - ..:/app
      - ../data:/app/data
    # WAV segments (audio.py's SlidingWindowCapture) are ephemeral scratch
    # data: each is read once by SegmentHandler.on_closed within
    # milliseconds of being closed, then deleted immediately if silent
    # (storage.delete_empty_segments, the common case in a quiet room) or
    # left for StorageManager's high-water-mark cleanup otherwise. None of
    # that needs SD-card durability, and at 24/7 duty cycle it's a
    # continuous write+delete workload on the card. Mounting this one
    # subdirectory as tmpfs (nested inside the ../data bind mount) routes
    # it to RAM instead — zero SD writes for the audio pipeline's dominant
    # disk hotspot. Sizing: worst case (continuous non-silent 48kHz mono
    # s16 audio, nothing ever silence-deleted) is ~96KB/s => a 100MB
    # high-water mark (BBWATCH_STORAGE__MAX_SIZE_MB below, its Pydantic
    # floor) fills in ~1000s; StorageManager's default 60s check interval
    # only lets it overshoot by ~6MB before trimming back toward 90%
    # (~90MB) — comfortably inside this 128MB cap (~28MB margin, ~5x the
    # worst-case overshoot). Real usage is far lower: quiet stretches are
    # deleted on the spot, so this is a large margin, not a tight budget.
    tmpfs:
      - /app/data/wav_segments:size=128m,mode=1777
    environment:
      - BBWATCH_LOG_LEVEL=DEBUG
      - BBWATCH_FAKE_HARDWARE=false
      - BBWATCH_DATA_DIR=/app/data
      # Set BBWATCH_AUDIO_SOURCE=disabled in docker/.env for deliberate
      # camera-only operation (no mic): bbwatch then starts cleanly in
      # video-only mode instead of retrying a dead audio stream forever.
      - BBWATCH_AUDIO__DEVICE_INDEX=${BBWATCH_AUDIO_SOURCE:-rtsp://${RPI_HOST:-127.0.0.1}:8554/babycam}
      - BBWATCH_MOTION__STREAM_URL=rtsp://${RPI_HOST:-127.0.0.1}:8554/raw_video
      # Well under the 128MB tmpfs cap above (see comment) — max_size_mb's
      # 1024MB config.yaml default assumes SD/disk-backed storage where
      # headroom is cheap; on tmpfs it's RAM, so keep the working set small.
      # 100 is StorageConfig.max_size_mb's Pydantic floor (ge=100.0).
      - BBWATCH_STORAGE__MAX_SIZE_MB=100
    command: /app/docker/entrypoint.sh

  # Interactive shell
  shell:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    stdin_open: true
    tty: true
    command: /bin/bash
    profiles:
      - dev

  # Fake audio generator for integration testing
  audio_generator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - test_data:/app/wav_segments
    command: python3 scripts/generate_test_audio.py --output /app/wav_segments --loop
    profiles:
      - integration

volumes:
  test_data:
