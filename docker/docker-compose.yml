# docker/docker-compose.yml

services:
  # Run tests
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    command: python3 -m pytest tests/ -v --tb=short

  # Audio demo with microphone passthrough
  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      - BBWATCH_LOG_LEVEL=DEBUG
    command: python3 scripts/demo.py --loop
    profiles:
      - demo

  # Video demo with webcam passthrough (requires X11)
  demo-video:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    devices:
      - /dev/video0:/dev/video0
    group_add:
      - video
    environment:
      - DISPLAY=${DISPLAY}
    command: python3 scripts/demo_video.py
    profiles:
      - demo

  # Full bbwatch application.
  # go2rtc runs natively on the host (deploy/go2rtc-host.yaml +
  # deploy/go2rtc.service): the CSI camera needs the host libcamera stack,
  # which no stock go2rtc image provides. The go2rtc host comes from
  # RPI_HOST in docker/.env (compose reads .env from this file's directory,
  # not the repo root) — with rootless Docker neither
  # localhost nor host-gateway reaches the real host, only its LAN IP.
  # The overlay FIFO is shared via the ../data bind mount go2rtc reads.
  bbwatch:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    network_mode: host
    volumes:
      - ..:/app
      - ../data:/app/data
    environment:
      - BBWATCH_LOG_LEVEL=DEBUG
      - BBWATCH_FAKE_HARDWARE=false
      - BBWATCH_DATA_DIR=/app/data
      # Set BBWATCH_AUDIO_SOURCE=disabled in docker/.env for deliberate
      # camera-only operation (no mic): bbwatch then starts cleanly in
      # video-only mode instead of retrying a dead audio stream forever.
      - BBWATCH_AUDIO__DEVICE_INDEX=${BBWATCH_AUDIO_SOURCE:-rtsp://${RPI_HOST:-127.0.0.1}:8554/babycam}
      - BBWATCH_MOTION__STREAM_URL=rtsp://${RPI_HOST:-127.0.0.1}:8554/raw_video
    command: /app/docker/entrypoint.sh

  # Interactive shell
  shell:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    stdin_open: true
    tty: true
    command: /bin/bash
    profiles:
      - dev

  # Fake audio generator for integration testing
  audio_generator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - test_data:/app/wav_segments
    command: python3 scripts/generate_test_audio.py --output /app/wav_segments --loop
    profiles:
      - integration

volumes:
  test_data:
